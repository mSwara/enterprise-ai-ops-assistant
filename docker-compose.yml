
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      # Read from a POSTGRES_PASSWORD variable in your shell/.env — never
      # hardcode a real password in this file, since it's committed to git.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
      POSTGRES_DB: enterprise_ai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Auto-start this container whenever the EC2 instance reboots (e.g.
    # after Stop/Start to save cost) or if it crashes. "unless-stopped"
    # means it won't restart only if you deliberately `docker compose stop`.
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      # Inside Compose, the backend reaches Postgres via the service name
      # "postgres", not localhost or host.docker.internal. This overrides
      # whatever DATABASE_URL is set to in your .env file. Password comes
      # from the same POSTGRES_PASSWORD variable as the postgres service.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}@postgres:5432/enterprise_ai_db
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: